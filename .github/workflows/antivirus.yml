name: Antivirus

# Every hour, checks the newest release's setup file and extension on VirusTotal (scripts/antivirus.mjs),
# and opens an issue if Microsoft Defender, or three or more engines, flag one. A new unsigned file can scan
# clean when built and be flagged an hour later, so this watches after release rather than before. It also
# runs as soon as a release finishes. Needs the VT_API_KEY secret (RELEASING.md); without it, it's skipped.

on:
  schedule:
    - cron: '41 * * * *'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write # open, update and close the "Antivirus flags …" issues

concurrency: antivirus

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the newest release on VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/antivirus.mjs
