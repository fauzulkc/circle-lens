name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # npm provenance: the package says which workflow run built it

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.mod
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Circle Lens $version" --notes "$notes"
          fi
      - name: Publish the website package to npm
        shell: bash
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::No NPM_TOKEN secret, so circle-lens $version was not published to npm."
          elif npm view "circle-lens@$version" version >/dev/null 2>&1; then
            echo "circle-lens $version is already on npm."
          else
            npm publish --provenance --access public
          fi
