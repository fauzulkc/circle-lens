name: Release

# A tag vX.Y.Z builds, tests and publishes everything (RELEASING.md has the one-time setup):
#   - the GitHub release, which installed Windows apps update themselves from;
#   - npm (the website package), through npm's trusted publishing, so no token is stored;
#   - winget, as a pull request to microsoft/winget-pkgs (WINGET_TOKEN);
#   - the Chrome Web Store, uploaded and submitted for review (the CWS_* secrets).
# A channel that isn't set up yet is skipped with a notice, never failing the release.
#
# npm can also be published on its own for a release that already exists (Actions → Release → Run
# workflow, with its tag): the app isn't built or uploaded again.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish this existing release to npm only (for example v1.2.0)'
        required: true

permissions:
  contents: write
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.mod
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Circle Lens $version" --notes "$notes"
          fi

  npm:
    # After the release, or on its own for an existing tag (workflow_dispatch).
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build:web
      - name: Publish the website package to npm
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # optional: trusted publishing needs no token
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "circle-lens@$version" version >/dev/null 2>&1; then
            echo "circle-lens $version is already on npm."
            exit 0
          fi
          npm install -g npm@11 --no-fund --no-audit >/dev/null # trusted publishing needs npm 11.5.1 or later
          if npm publish --provenance --access public; then
            echo "Published circle-lens $version to npm."
          else
            echo "::error::circle-lens $version was not published to npm: npmjs.com doesn't trust this workflow yet. Set up trusted publishing (RELEASING.md), then run this workflow again for the tag."
            exit 1
          fi

  winget:
    needs: release
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit the new version to winget
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Output "::notice::No WINGET_TOKEN secret, so this version was not submitted to winget (RELEASING.md)."
            exit 0
          }
          # wingetcreate updates a package winget already has; the first version went in by hand (store/winget).
          try {
            Invoke-RestMethod https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/f/FauzulChowdhury/CircleLens | Out-Null
          } catch {
            Write-Output "::notice::FauzulChowdhury.CircleLens isn't in winget-pkgs yet (its first pull request is still open), so this version was not submitted."
            exit 0
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/CircleLens-Setup-$version.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update FauzulChowdhury.CircleLens --version $version --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  chrome-web-store:
    needs: release
    runs-on: ubuntu-latest
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Upload the extension and submit it for review
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_CLIENT_SECRET" ] || [ -z "$CWS_REFRESH_TOKEN" ] || [ -z "$CWS_PUBLISHER_ID" ] || [ -z "$CWS_EXTENSION_ID" ]; then
            echo "::notice::The Chrome Web Store secrets aren't all set, so this version was not uploaded there (RELEASING.md)."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          zip="circle-lens-extension-$version.zip"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$zip"
          token="$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)"
          echo "::add-mask::$token"
          api="https://chromewebstore.googleapis.com"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          answer="$(curl -sS -H "Authorization: Bearer $token" -X POST -T "$zip" "$api/upload/v2/$item:upload")"
          echo "$answer"
          state="$(jq -r '.uploadState // "FAILED"' <<<"$answer")"
          for attempt in $(seq 1 30); do
            case "$state" in *IN_PROGRESS) ;; *) break ;; esac
            sleep 10
            state="$(curl -sS -H "Authorization: Bearer $token" "$api/v2/$item:fetchStatus" | jq -r '.lastAsyncUploadState // "IN_PROGRESS"')"
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::The Chrome Web Store upload ended as $state."
            exit 1
          fi
          curl -fsS -H "Authorization: Bearer $token" -X POST "$api/v2/$item:publish"
          echo
          echo "Circle Lens $version was uploaded and submitted for review; it's published once the review passes."
